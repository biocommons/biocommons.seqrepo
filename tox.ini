[tox]
skipsdist = true
envlist = py312, py313, py314, py315

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[testenv]
allowlist_externals = make, uv
commands =
    make test
passenv =
    PYTHON_VERSION
setenv =
    PYTHONHASHSEED = 0
usedevelop = True
whitelist_externals =
    make
